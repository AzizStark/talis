minimize_to_tray = true

[transport]
enabled = true
# Elliptical button faces, projected from the scene currently shipped in Talis.
# [top-left x, top-left y, width, height] in scene-normalized coordinates.
play_pause = [0.3576794863, 0.6391354501, 0.0197497606, 0.0134078562]
previous = [0.3829452097, 0.6451604068, 0.0101774633, 0.0073829293]
next = [0.3994382620, 0.6451604068, 0.0100741386, 0.0073829293]

[render]
fps = 60
# MATE-only experimental placement; covers desktop icons when enabled.
experimental_mate_overlay = false
# Native Wayland only: automatic, background or bottom. Applied at startup.
wayland_layer = "automatic"
pause_when_hidden = true
rotate_artwork = true
# False holds the arm; artwork/dust can still rotate and media controls still work.
animate_arm = true
finish = "silver"
arm_interpolation = false
arm_response_seconds = 0.6
arm_range_start = 0.0
arm_range_end = 1.0

[scene]
mode = "beauty"
variant = "day"
background = "assets/scenes/1440p/day/beauty.png"
arm_poses = "assets/scenes/1440p/day/arm-poses/atlas.json"
arm_flow = "assets/scenes/1440p/day/arm-flow/atlas.json"
sleeve = "assets/scenes/1440p/day/sleeve/atlas.json"
record_lighting = "assets/scenes/1440p/day/record-lighting/atlas.json"
vinyl_detail = "assets/scenes/1440p/day/vinyl-detail/atlas.json"
buttons = "assets/scenes/1440p/day/buttons/atlas.json"

[scene.night]
background = "assets/scenes/1440p/night/beauty.png"
arm_poses = "assets/scenes/1440p/night/arm-poses/atlas.json"
arm_flow = "assets/scenes/1440p/night/arm-flow/atlas.json"
sleeve = "assets/scenes/1440p/night/sleeve/atlas.json"
record_lighting = "assets/scenes/1440p/night/record-lighting/atlas.json"
vinyl_detail = "assets/scenes/1440p/night/vinyl-detail/atlas.json"
buttons = "assets/scenes/1440p/night/buttons/atlas.json"

# Projected square around the circular cover. Coordinates are scene fractions.
[artwork]
enabled = true
sleeve_enabled = true
# 0 restores Blender shading; 0.25 gently lifts only shaded sleeve artwork.
sleeve_shadow_lift = 0.25
record_lighting = true
# Multipliers on authored dust/scratches only; 1.0 preserves the Blender overlay.
vinyl_opacity = 1.0 # 0..1; 0 hides marks
vinyl_brightness = 1.0 # 0..2; does not change transparency or scene lighting
size_percent = 36.0
rotation_rpm = 33.33
corners = [[0.38203880, 0.49312621], [0.57033771, 0.49312621], [0.58017546, 0.62102577], [0.36554030, 0.62102577]]
