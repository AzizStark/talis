<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="512" height="512" viewBox="0 0 512 512">
  <title>Talis default record label</title>
  <desc>Flat brown paper and cream print only. Scene lighting, contact shading
    and spindle coverage are supplied by the stationary record response.</desc>
  <defs>
    <filter id="cream" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.929412
        0 0 0 0 0.862745 0 0 0 0 0.733333 0 0 0 1 0"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#684b36"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#eddbbb" stroke-width="2"/>
  <image x="143" y="77" width="226" height="162.59"
         xlink:href="../../ui/branding/talis-logo.png" filter="url(#cream)"/>
  <text x="256" y="403" text-anchor="middle" font-family="sans-serif"
        font-size="13" letter-spacing="4" fill="#eddbbb">33 RPM   STEREO</text>
</svg>
